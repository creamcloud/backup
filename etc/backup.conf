# Cream Cloud Backup - default configuration.
#
# This file is committed to the repository, so it must not contain secrets
# or server-specific values. Those belong in LOCAL_CONFIG_FILE below (default
# /etc/creamcloud-backup/backup.conf), which is created by the installer,
# lives outside this folder, and may override any variable below.
#
# Values are single-quoted: Symfony Dotenv treats single quotes as fully
# literal (no "$VAR" interpolation, no backslash escaping), unlike double
# quotes, so this is safe for values that may contain spaces or special
# characters (e.g. passwords).

# Server hostname. Used as the Restic/Swift container identity. Must be
# unique among backed up servers. Set in LOCAL_CONFIG_FILE during install.
HOSTNAME='server.creamcloud.io'

# Keep this many daily snapshots / create a new full backup if the last one
# is older than this many days.
KEEP_DAILY='7'

# Keep at most this many weekly snapshots.
KEEP_WEEKLY='2'

# Only change this if your tmp folder is too small. See README.
TEMPDIR='/tmp'

# Path that gets backed up.
BACKUP_PATH='/'

# Restic repository and password file.
RESTIC_REPOSITORY='swift:creamcloud-backup:/'
RESTIC_PASSWORD_FILE='/etc/creamcloud-backup/restic-password.conf'

# Per-server configuration (OpenStack credentials, hostname, and any
# overrides), generated by the installer. See the comment at the top of
# this file.
LOCAL_CONFIG_FILE='/etc/creamcloud-backup/backup.conf'

# File with one exclude pattern per line, passed to "restic backup --exclude-file".
# Defaults to etc/exclude.conf when not set.
EXCLUDE_FILE=''

# Name of the Swift container used for status objects and storage stats.
SWIFT_CONTAINER='creamcloud-backup'

# OpenStack / Swift authentication. Filled in by the installer
# (credentials are stored in LOCAL_CONFIG_FILE, not here).
OS_USERNAME=''
OS_PASSWORD=''
OS_PROJECT_NAME=''
OS_USER_DOMAIN_NAME='transip'
OS_PROJECT_DOMAIN_NAME='transip'
OS_REGION_NAME='NL'
OS_AUTH_URL='https://auth.teamblue.cloud/v3'
OS_IDENTITY_API_VERSION='3'

# Mailer DSN used for failure notifications. See
# https://symfony.com/doc/current/mailer.html#using-built-in-transports
# Defaults to "do nothing".
MAILER_DSN='null://null'

# Comma separated list of email addresses to notify on backup failure.
NOTIFICATION_EMAILS=''

# Sender address used for notification emails.
MAIL_FROM='creamcloud-backup@server.creamcloud.io'
